<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Official Richland County High School Tigers merchandise. Student-designed tees, personalized by you - pickup at RCHS is always free." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RCHS Store" />
    <meta property="og:title" content="RCHS Store - Richland County Tigers" />
    <meta property="og:description" content="Wear the Tiger within - official RCHS merchandise, designed by our community and made to order." />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)" />
    <title>RCHS Store - Richland County Tigers</title>
    <script>
      try {
        var t = localStorage.getItem('rchs-theme')
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
